# ============================================================
# AEOS Configuration Example
# Copy to ~/.aeos/config.yaml (global) or .aeos/config.yaml
# (project-level override, merged on top of global config)
# ============================================================

# ────────────────────────────────────────────────────────────
# PROVIDERS
# Define one or more LLM providers. Each has a unique key.
# Supported types: openai | anthropic | vertex_ai | ollama
# ────────────────────────────────────────────────────────────
providers:

  # ── LOCAL: Ollama on this machine ─────────────────────────
  local_ollama:
    type: ollama
    base_url: "http://localhost:11434"   # default Ollama port → native /api/chat protocol
    models:
      - mistral
      - codellama:7b
      - phi3:mini
      - llama3.1:8b
    # Optional: declare the model's context window so AEOS never requests
    # more output tokens than the window allows.  Highly recommended for
    # any local model with a 4096-token context.
    context_window: 4096   # total tokens available (prompt + completion)
    max_tokens: 1500       # hard cap on completion tokens; leave ~2500 for prompts

  # ── LOCAL: LM Studio ──────────────────────────────────────
  # LM Studio exposes an OpenAI-compatible API on port 1234.
  # Use type: ollama with the LM Studio base_url — AEOS automatically
  # switches to /v1/chat/completions (OpenAI-compat mode) whenever
  # the base_url is not the default Ollama localhost:11434.
  local_lm_studio:
    type: ollama
    base_url: "http://127.0.0.1:1234"   # LM Studio default port
    # openai_compat: true               # set automatically — no need to write this
    context_window: 4096
    max_tokens: 1500

  # ── LOCAL: vLLM / llama.cpp / text-gen-webui ──────────────
  # Same auto-detection: any non-default Ollama URL → OpenAI-compat mode.
  local_vllm:
    type: ollama
    base_url: "http://localhost:8000"    # vLLM default port
    context_window: 8192                 # adjust for your model
    max_tokens: 4096

  # ── LOCAL: Ollama on a DIFFERENT machine on the network ───
  team_ollama:
    type: ollama
    base_url: "http://192.168.1.100:11434"
    context_window: 4096
    max_tokens: 1500

  # ── LOCAL: Anthropic-compatible server (e.g. LiteLLM proxy) ──
  local_anthropic_compat:
    type: anthropic
    base_url: "http://localhost:8001"
    api_key_env: LOCAL_ANTHROPIC_KEY

  remote_litellm_proxy:
    type: anthropic
    base_url: "http://my-inference-box:4000"
    api_key_env: LITELLM_API_KEY

  # ── CLOUD: OpenAI ─────────────────────────────────────────
  openai_cloud:
    type: openai
    base_url: "https://api.openai.com/v1"
    api_key_env: OPENAI_API_KEY
    timeout: 120
    max_tokens: 8192   # cloud models support large outputs

  # ── CLOUD: OpenAI-compatible (Groq, Together, Fireworks, etc.) ──
  groq_cloud:
    type: openai
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: GROQ_API_KEY
    max_tokens: 4096

  together_cloud:
    type: openai
    base_url: "https://api.together.xyz/v1"
    api_key_env: TOGETHER_API_KEY

  # ── CLOUD: Anthropic ──────────────────────────────────────
  anthropic_cloud:
    type: anthropic
    # base_url: omit to use default api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    timeout: 180
    max_tokens: 8192

  # ── CLOUD: Google Vertex AI ───────────────────────────────
  vertex_ai:
    type: vertex_ai
    project: my-gcp-project-id
    location: us-central1
    # Auth: Application Default Credentials (ADC)
    # Run: gcloud auth application-default login

# ────────────────────────────────────────────────────────────
# MODEL ROUTING
# Maps (task_type, complexity) → (provider, model)
#
# Task types:
#   inference  — reasoning, analysis, requirements, architecture
#   coding     — code generation, debugging, refactoring
#   planning   — project planning, decomposition
#   review     — artifact review, code review
#   verification — test generation, test analysis
#
# Complexities:
#   high   — large context, complex reasoning, critical decisions
#   medium — moderate complexity, standard tasks
#   low    — small focused tasks, SLMs handle these well
# ────────────────────────────────────────────────────────────
routing:
  inference:
    high:
      provider: anthropic_cloud
      model: claude-opus-4-5
    medium:
      provider: openai_cloud
      model: gpt-4o
    low:
      provider: local_ollama
      model: mistral

  coding:
    high:
      provider: anthropic_cloud
      model: claude-sonnet-4-5
    medium:
      provider: openai_cloud
      model: gpt-4o
    low:
      provider: local_ollama
      model: codellama:7b

  planning:
    high:
      provider: anthropic_cloud
      model: claude-opus-4-5
    medium:
      provider: anthropic_cloud
      model: claude-haiku-4-5
    low:
      provider: local_ollama
      model: llama3.1:8b

  review:
    high:
      provider: anthropic_cloud
      model: claude-opus-4-5
    medium:
      provider: openai_cloud
      model: gpt-4o
    low:
      provider: local_ollama
      model: mistral

  verification:
    high:
      provider: openai_cloud
      model: gpt-4o
    medium:
      provider: local_ollama
      model: llama3.1:8b
    low:
      provider: local_ollama
      model: phi3:mini

# ────────────────────────────────────────────────────────────
# PROJECT DEFAULTS
# ────────────────────────────────────────────────────────────
project:
  workspace_dir: ".aeos"
  max_retries: 3
  ask_on_critical: true
  decompose_threshold: 300
  auto_activate_stages: true
  git_author_name: "AEOS Autonomous Agent"
  git_author_email: "aeos@localhost"

# ────────────────────────────────────────────────────────────
# LOGGING
# ────────────────────────────────────────────────────────────
logging:
  level: INFO
  file: ".aeos/aeos.log"


