# ============================================================
# AEOS Configuration Example
# Copy to ~/.aeos/config.yaml (global) or .aeos/config.yaml
# (project-level override, merged on top of global config)
# ============================================================

# ────────────────────────────────────────────────────────────
# PROVIDERS
# Define one or more LLM providers. Each has a unique key.
# Supported types: openai | anthropic | vertex_ai | ollama
#
# Token budget fields (for local models especially):
#
#   context_window: <int>   Total token capacity of the model (prompt + completion).
#                           Setting this alone is enough for most users.
#                           AEOS automatically reserves half for the prompt:
#                             effective max_tokens = context_window / 2
#
#   max_tokens: <int>       Hard cap on completion tokens sent in the API request.
#                           Use this when you want EXACT control instead of
#                           the automatic context_window / 2 heuristic.
#                           Always wins over context_window if both are set.
#
#   Only set context_window          → auto-safe (simple, recommended)
#   Only set max_tokens              → explicit control
#   Set both                         → max_tokens wins
#   Set neither                      → AEOS uses its built-in default (2048)
# ────────────────────────────────────────────────────────────
providers:

  # ── LOCAL: Ollama (default install) ───────────────────────
  local_ollama:
    type: ollama
    base_url: "http://localhost:11434"   # default port → native /api/chat
    models:
      - mistral
      - codellama:7b
      - phi3:mini
      - llama3.1:8b
    context_window: 4096   # ← just set this; AEOS caps completions at 2048 automatically

  # ── LOCAL: LM Studio ──────────────────────────────────────
  # LM Studio exposes an OpenAI-compatible API.
  # Use type: ollama — AEOS auto-detects any non-default URL as OpenAI-compat
  # and switches to /v1/chat/completions automatically.
  local_lm_studio:
    type: ollama
    base_url: "http://127.0.0.1:1234"   # LM Studio default port
    context_window: 4096                 # auto-caps completions at 2048
    # max_tokens: 1500                   # optional: override if prompts are large

  # ── LOCAL: vLLM / llama.cpp / text-gen-webui ──────────────
  local_vllm:
    type: ollama
    base_url: "http://localhost:8000"
    context_window: 8192                 # auto-caps completions at 4096

  # ── LOCAL: Ollama on another machine ──────────────────────
  team_ollama:
    type: ollama
    base_url: "http://192.168.1.100:11434"
    context_window: 4096

  # ── LOCAL: Anthropic-compatible server (e.g. LiteLLM proxy) ──
  local_anthropic_compat:
    type: anthropic
    base_url: "http://localhost:8001"
    api_key_env: LOCAL_ANTHROPIC_KEY

  remote_litellm_proxy:
    type: anthropic
    base_url: "http://my-inference-box:4000"
    api_key_env: LITELLM_API_KEY

  # ── CLOUD: OpenAI ─────────────────────────────────────────
  openai_cloud:
    type: openai
    base_url: "https://api.openai.com/v1"
    api_key_env: OPENAI_API_KEY
    timeout: 120
    max_tokens: 8192   # cloud models support large outputs

  # ── CLOUD: OpenAI-compatible (Groq, Together, Fireworks, etc.) ──
  groq_cloud:
    type: openai
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: GROQ_API_KEY
    max_tokens: 4096

  together_cloud:
    type: openai
    base_url: "https://api.together.xyz/v1"
    api_key_env: TOGETHER_API_KEY

  # ── CLOUD: Anthropic ──────────────────────────────────────
  anthropic_cloud:
    type: anthropic
    # base_url: omit to use default api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    timeout: 180
    max_tokens: 8192

  # ── CLOUD: Google Vertex AI ───────────────────────────────
  vertex_ai:
    type: vertex_ai
    project: my-gcp-project-id
    location: us-central1
    # Auth: Application Default Credentials (ADC)
    # Run: gcloud auth application-default login

# ────────────────────────────────────────────────────────────
# MODEL ROUTING
# Maps (task_type, complexity) → (provider, model)
#
# Task types:
#   inference  — reasoning, analysis, requirements, architecture
#   coding     — code generation, debugging, refactoring
#   planning   — project planning, decomposition
#   review     — artifact review, code review
#   verification — test generation, test analysis
#
# Complexities:
#   high   — large context, complex reasoning, critical decisions
#   medium — moderate complexity, standard tasks
#   low    — small focused tasks, SLMs handle these well
# ────────────────────────────────────────────────────────────
routing:
  inference:
    high:
      provider: anthropic_cloud
      model: claude-opus-4-5
    medium:
      provider: openai_cloud
      model: gpt-4o
    low:
      provider: local_ollama
      model: mistral

  coding:
    high:
      provider: anthropic_cloud
      model: claude-sonnet-4-5
    medium:
      provider: openai_cloud
      model: gpt-4o
    low:
      provider: local_ollama
      model: codellama:7b

  planning:
    high:
      provider: anthropic_cloud
      model: claude-opus-4-5
    medium:
      provider: anthropic_cloud
      model: claude-haiku-4-5
    low:
      provider: local_ollama
      model: llama3.1:8b

  review:
    high:
      provider: anthropic_cloud
      model: claude-opus-4-5
    medium:
      provider: openai_cloud
      model: gpt-4o
    low:
      provider: local_ollama
      model: mistral

  verification:
    high:
      provider: openai_cloud
      model: gpt-4o
    medium:
      provider: local_ollama
      model: llama3.1:8b
    low:
      provider: local_ollama
      model: phi3:mini

# ────────────────────────────────────────────────────────────
# PROJECT DEFAULTS
# ────────────────────────────────────────────────────────────
project:
  workspace_dir: ".aeos"
  max_retries: 3
  ask_on_critical: true
  decompose_threshold: 300
  auto_activate_stages: true
  git_author_name: "AEOS Autonomous Agent"
  git_author_email: "aeos@localhost"

# ────────────────────────────────────────────────────────────
# LOGGING
# ────────────────────────────────────────────────────────────
logging:
  level: INFO
  file: ".aeos/aeos.log"


