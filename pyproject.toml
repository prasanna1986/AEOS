[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeos"
version = "0.1.0"
description = "Autonomous Engineering Operating System — a persistent CLI agent that transforms objectives into verified, production-ready engineering outcomes."
authors = [{ name = "AEOS Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "openai>=1.35.0",
    "anthropic>=0.29.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
    "gitpython>=3.1.43",
    "anyio>=4.4.0",
    "tenacity>=8.3.0",
    "click>=8.1.7",
    "prompt_toolkit>=3.0.47",
]

[project.optional-dependencies]
vertex = [
    "google-cloud-aiplatform>=1.57.0",
    "google-auth>=2.30.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
aeos = "aeos.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aeos*"]

[tool.setuptools.package-data]
"aeos" = ["prompts/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
